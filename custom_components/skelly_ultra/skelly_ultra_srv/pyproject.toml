[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "skelly-ultra-server"
version = "1.0.0"
description = "REST server providing Bluetooth Classic audio playback and/or BLE proxy services for Ultra Skelly devices"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.9.0",
    "dbus-next>=0.2.0",
    "bleak>=0.21.0",
]

# This folder is the skelly_ultra_srv package itself, run from its parent
# folder with `python -m skelly_ultra_srv.server`, so `pip install .` here
# only installs the dependencies
[tool.setuptools]
py-modules = []
