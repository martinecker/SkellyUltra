enable_classic_bt:
  name: Enable classic Bluetooth
  description: Make the Skelly Ultra expose a classic Bluetooth speaker to connect to for live mode.
  fields:
    device_id:
      name: Device id
      description: The device registry id of the Skelly device to target
      example: "1234567890abcdef"
    entity_id:
      name: Entity id
      description: An entity id associated with the device. If provided, the device_id will be derived from this entity
      example: "select.skelly_eye_icon"

play_file:
  name: Play file
  description: Play a file from the device's internal storage by file index.
  fields:
    device_id:
      name: Device id
      description: The device registry id of the Skelly device to target
      example: "1234567890abcdef"
    entity_id:
      name: Entity id
      description: An entity id associated with the device. If provided, the device_id will be derived from this entity
      example: "sensor.skelly_ultra_volume"
    file_index:
      name: File index
      description: The 1-based index of the file to play (must be at least 1)
      required: true
      example: 1
      selector:
        number:
          min: 1
          step: 1
          mode: box

stop_file:
  name: Stop file
  description: Stop a file that is currently playing on the device by file index.
  fields:
    device_id:
      name: Device id
      description: The device registry id of the Skelly device to target
      example: "1234567890abcdef"
    entity_id:
      name: Entity id
      description: An entity id associated with the device. If provided, the device_id will be derived from this entity
      example: "sensor.skelly_ultra_volume"
    file_index:
      name: File index
      description: The 1-based index of the file to stop (must be at least 1)
      required: true
      example: 1
      selector:
        number:
          min: 1
          step: 1
          mode: box

cancel_file_transfer:
  name: Cancel file transfer
  description: Cancel an ongoing file upload to the Skelly device. This will stop the current file transfer in progress.
  fields:
    device_id:
      name: Device id
      description: The device registry id of the Skelly device to target
      example: "1234567890abcdef"
    entity_id:
      name: Entity id
      description: An entity id associated with the device. If provided, the device_id will be derived from this entity
      example: "sensor.skelly_ultra_volume"

send_file:
  name: Send file
  description: Upload an audio file to the Skelly device. The file will be automatically converted to 8kHz mono MP3 format if needed. Supports local paths, HTTP/HTTPS URLs, Home Assistant media URLs, and media source IDs (media-source://...), such as files uploaded through the media browser. Using a filename already existing on the device will replace that file. Returns the filename and file_index on the device, so a following play_file can play it.
  fields:
    device_id:
      name: Device id
      description: The device registry id of the Skelly device to target
      example: "1234567890abcdef"
    entity_id:
      name: Entity id
      description: An entity id associated with the device. If provided, the device_id will be derived from this entity
      example: "sensor.skelly_ultra_volume"
    file_path:
      name: File path
      description: Path to the audio file. Can be a local filesystem path, an HTTP/HTTPS URL to download, a Home Assistant media URL (e.g., /media/local/sounds/file.mp3), or a media source ID (e.g., media-source://media_source/local/sounds/file.mp3). Text-to-speech media source IDs work too, but send_file_from_tts is easier to use.
      required: true
      example: "/media/local/sounds/announcement.mp3"
      selector:
        text:
    target_filename:
      name: Target filename
      description: The filename to save as on the device (should end with .mp3). If a file of this name already exists on the device it will be overwritten!
      required: true
      example: "announcement.mp3"
      selector:
        text:

send_file_from_tts:
  name: Send file from TTS
  description: Speak a message with a text-to-speech entity and upload the result to the Skelly device as an audio file. Returns the filename and file_index on the device, so a following play_file can play it. Using a filename already existing on the device will replace that file.
  fields:
    device_id:
      name: Device id
      description: The device registry id of the Skelly device to target
      example: "1234567890abcdef"
    entity_id:
      name: Entity id
      description: An entity id associated with the device. If provided, the device_id will be derived from this entity
      example: "sensor.skelly_ultra_volume"
    tts_entity:
      name: Text-to-speech entity
      description: The TTS entity (or legacy TTS provider) that speaks the message.
      required: true
      example: "tts.elevenlabs"
      selector:
        entity:
          domain: tts
    message:
      name: Message
      description: The text to speak.
      required: true
      example: "Welcome, mortal. Come closer."
      selector:
        text:
          multiline: true
    target_filename:
      name: Target filename
      description: The filename to save as on the device. The .mp3 extension is added automatically. If omitted, the name is built from the message. If a file of this name already exists on the device it will be overwritten!
      example: "welcome"
      selector:
        text:
    language:
      name: Language
      description: Language code exactly as the TTS entity lists it (for example en, en-US or en_US). Defaults to the entity's default language.
      example: "en"
      selector:
        text:
    tts_options:
      name: TTS options
      description: Options for the TTS entity, such as voice. The keys and values depend on the engine; ElevenLabs, for example, takes a voice ID.
      example: '{"voice": "21m00Tcm4TlvDq8ikWAM"}'
      selector:
        object:

delete_file:
  name: Delete file
  description: Delete a file from the Skelly device's internal storage. The file can be specified either by file_index and cluster (both required), or by filename. The service will refresh the file list before and after the delete operation.
  fields:
    device_id:
      name: Device id
      description: The device registry id of the Skelly device to target
      example: "1234567890abcdef"
    entity_id:
      name: Entity id
      description: An entity id associated with the device. If provided, the device_id will be derived from this entity
      example: "sensor.skelly_ultra_volume"
    file_index:
      name: File index
      description: The 0-based index of the file to delete. Must be used together with cluster. Mutually exclusive with filename.
      required: false
      example: 0
      selector:
        number:
          min: 0
          step: 1
          mode: box
    cluster:
      name: Cluster
      description: The cluster value of the file to delete. Must be used together with file_index. Mutually exclusive with filename.
      required: false
      example: 12345678
      selector:
        number:
          min: 0
          step: 1
          mode: box
    filename:
      name: Filename
      description: The name of the file to delete (e.g., "announcement.mp3"). The service will look up the corresponding file_index and cluster. Mutually exclusive with file_index and cluster.
      required: false
      example: "announcement.mp3"
      selector:
        text:

edit_file:
  name: Edit file
  description: Change the movement, eye icon and lights a file on the Skelly device uses while it plays. The file is given by filename, or by file_index and cluster. Settings you leave out keep their current values, and only values that change are sent to the device.
  fields:
    device_id:
      name: Device id
      description: The device registry id of the Skelly device to target
      example: "1234567890abcdef"
    entity_id:
      name: Entity id
      description: An entity id associated with the device. If provided, the device_id will be derived from this entity
      example: "sensor.skelly_ultra_volume"
    filename:
      name: Filename
      description: The name of the file to edit (e.g., "announcement.mp3"). Mutually exclusive with file_index and cluster.
      example: "announcement.mp3"
      selector:
        text:
    file_index:
      name: File index
      description: The index of the file, as reported in the file list. Must be used together with cluster. Mutually exclusive with filename.
      example: 1
      selector:
        number:
          min: 0
          step: 1
          mode: box
    cluster:
      name: Cluster
      description: The cluster value of the file. Must be used together with file_index. Mutually exclusive with filename.
      example: 12345678
      selector:
        number:
          min: 0
          step: 1
          mode: box
    movements:
      name: Movements
      description: The body parts that move while the file plays, replacing the current set. Ultra Skelly has all, head, arm and torso; 12ft Skelly has head; Lethal Lily has all, wrist, elbow, head and eyes. An empty list turns movement off.
      example: '["head", "arm"]'
      selector:
        select:
          multiple: true
          custom_value: true
          options:
            - all
            - head
            - arm
            - torso
            - wrist
            - elbow
            - eyes
    eye_icon:
      name: Eye icon
      description: The 1-based eye icon number, as in the Eye Icon select (1-18 on Ultra Skelly, 1-20 on 12ft Skelly). Not available on Lethal Lily.
      example: 5
      selector:
        number:
          min: 1
          max: 20
          step: 1
          mode: box
    lights:
      name: Lights
      description: >-
        A list of light channel settings. Each item needs channel (0 torso, 1 head on Ultra Skelly; 0 on 12ft Skelly and Lethal Lily);
        brightness (0-255), effect_mode (a mode name such as Static, Strobe, Pulse, or 1-3), effect_speed (0 slowest to 254 fastest,
        like the Effect Speed entities), rgb ([r, g, b]) and color_cycle (true/false) are optional, and anything left out keeps its current value.
      example: '[{"channel": 0, "rgb": [255, 0, 0], "effect_mode": "Pulse", "effect_speed": 200}]'
      selector:
        object:

perform:
  name: Perform
  description: Make the Skelly say a line in live mode, with eyes, lights and movement to match a mood. The line is either a literal message or written by an AI Task entity from a prompt (optionally looking at a camera snapshot). Turns live mode on if it is off and leaves it on. Returns status, line, mood, person_present and history; if a perform is already running on this Skelly, returns status busy and does nothing.
  fields:
    device_id:
      name: Device
      description: The device registry id of the Skelly device to target
      example: "1234567890abcdef"
      selector:
        device:
          integration: skelly_ultra
    entity_id:
      name: Entity id
      description: An entity id associated with the device. If provided, the device_id will be derived from this entity
      example: "media_player.skelly_ultra_live_mode_speaker"
      selector:
        entity:
          integration: skelly_ultra
    message:
      name: Message
      description: A literal line to say. Skips the AI. Give either message or prompt.
      example: "Welcome, mortal!"
      selector:
        text:
          multiline: true
    prompt:
      name: Prompt
      description: Instructions for the AI to write the line, sent as is. The last 10 AI lines for this Skelly are added with a request not to repeat them. Give either message or prompt.
      example: "You are a cheeky skeleton guarding the front door. Greet whoever is there in one short sentence."
      selector:
        text:
          multiline: true
    camera_entity:
      name: Camera
      description: A camera whose snapshot is attached to the AI request. Needs a prompt. The response then also says whether a person was seen (person_present); the Skelly speaks either way.
      example: "camera.front_door"
      selector:
        entity:
          domain: camera
    camera_wait:
      name: Camera wait
      description: With a camera, how long to wait for it to publish a new image before sending it to the AI. Snapshot cameras such as ring-mqtt publish the image of what triggered the motion a moment after the motion event, so sending the image right away would show the AI the previous one. Without a new image in time, the current one is used. 0 sends the current image right away. This only helps cameras that update their entity with each new image (such as ring-mqtt); for other cameras set 0 to skip the wait.
      default: 1
      selector:
        number:
          min: 0
          max: 60
          step: 0.1
          unit_of_measurement: s
          mode: box
    ai_task_entity:
      name: AI Task entity
      description: The AI Task entity that writes the line. Defaults to the preferred AI Task entity set in Home Assistant.
      example: "ai_task.openai"
      selector:
        entity:
          domain: ai_task
    tts_entity:
      name: Text-to-speech entity
      description: The TTS entity that speaks the line.
      required: true
      example: "tts.elevenlabs"
      selector:
        entity:
          domain: tts
    tts_options:
      name: TTS options
      description: Options for the TTS entity, such as voice.
      example: '{"voice": "Rachel"}'
      selector:
        object:
    mood:
      name: Mood
      description: The look for the line. auto lets the AI pick (needs a prompt), none leaves eyes, lights and movement as they are. Defaults to auto with a prompt and none with a message.
      example: "spooky"
      selector:
        select:
          options:
            - auto
            - none
            - friendly
            - spooky
            - menacing
            - playful
            - mysterious
    movement:
      name: Movement
      description: Which body parts move. mood uses the mood's movement, none sends no movement, or pick the parts to move (also works with mood none). Parts the device doesn't have are an error.
      default:
        - mood
      example: "head"
      selector:
        select:
          multiple: true
          options:
            - mood
            - none
            - all
            - head
            - arm
            - torso
            - wrist
            - elbow
            - eyes
    restore:
      name: Restore eyes and lights
      description: Put the eyes and lights back the way they were after the line.
      default: true
      selector:
        boolean:
    restore_movement:
      name: Restore movement
      description: Send the previous movement setting back after the line. This makes the Skelly move once more, so it is off by default and the movement switches then show the movement perform used.
      default: false
      selector:
        boolean:
    live_mode_timeout:
      name: Live mode timeout
      description: How long to wait for live mode to connect before failing.
      default: 30
      selector:
        number:
          min: 1
          max: 300
          step: 1
          unit_of_measurement: s
          mode: box
    wait_until_done:
      name: Wait until done
      description: Return only after the line has finished and the look is restored. When off, the action returns as soon as the line starts playing (with the same response), so following actions such as notifications run while the Skelly speaks; the rest continues in the background and a second perform stays busy until it ends.
      default: true
      selector:
        boolean:
