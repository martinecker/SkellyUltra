name: Frontend

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-and-build:
    name: check and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint, type check and unit tests
        run: npm run check
      - name: Build
        run: npm run build
      # The built bundle is committed (HACS installs it as is), so it must
      # match the sources, with no file changed, missing or added
      - name: Check that the committed bundle is up to date
        run: |
          git status --porcelain -- ../custom_components/skelly_ultra/frontend/
          test -z "$(git status --porcelain -- ../custom_components/skelly_ultra/frontend/)"
